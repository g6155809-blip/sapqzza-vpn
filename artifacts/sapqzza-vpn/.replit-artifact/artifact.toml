kind = "mobile"
previewPath = "/"
title = "SAPQZZA VPN"
version = "1.0.0"
id = "artifacts/sapqzza-vpn"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18596

[services.development]
run = "pnpm --filter @workspace/sapqzza-vpn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sapqzza-vpn", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sapqzza-vpn", "run", "serve" ]

[services.env]
PORT = "18596"
BASE_PATH = "/"
